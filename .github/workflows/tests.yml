name: Tests
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev,data]'
      - run: pytest -q
      - name: New experiment scaffolding
        run: |
          lispyn new examples/generated_starter.hy
          lispyn build examples/generated_starter.hy
          python - <<'PY'
          import nbformat
          nb = nbformat.read('examples/generated_starter.ipynb', as_version=4)
          assert any('Eduardo J. Barrios' in cell.source for cell in nb.cells if cell.cell_type == 'markdown')
          assert sum(cell.cell_type == 'code' for cell in nb.cells) >= 1
          PY
      - name: Hy translation smoke test
        run: |
          python - <<'PY'
          import subprocess
          import tempfile
          from pathlib import Path
          with tempfile.TemporaryDirectory() as temp:
              path = Path(temp) / 'sample.hy'
              path.write_text('(print (+ 1 2))\n')
              p = subprocess.run(['lispyn', 'build', str(path)], capture_output=True, text=True)
              assert p.returncode == 0, p.stderr
              assert path.with_suffix('.ipynb').exists()
          PY
      - name: End-to-end Hy -> executed notebook
        run: |
          python - <<'PY'
          import nbformat
          import subprocess
          import tempfile
          from pathlib import Path
          with tempfile.TemporaryDirectory() as temp:
              path = Path(temp) / 'experiment.hy'
              path.write_text('(print (+ 1 2))\n')
              p = subprocess.run(['lispyn', 'execute', str(path), '--timeout', '30'], capture_output=True, text=True)
              assert p.returncode == 0, p.stderr
              notebook = nbformat.read(path.with_suffix('.ipynb'), as_version=4)
              assert any('3' in str(output.get('text', '')) for output in notebook.cells[1].outputs)
              p = subprocess.run(['lispyn', 'run', str(path)], capture_output=True, text=True)
              assert p.returncode == 0, p.stderr
              assert p.stdout.strip() == '3'
          PY
      - name: Lispyn macro compilation smoke test
        run: lispyn build examples/first_experiment.hy
      - name: Sectioned notebook compilation
        run: |
          lispyn build examples/dataset_experiment.hy
          python - <<'PY'
          import nbformat
          from pathlib import Path
          notebook = nbformat.read(Path('examples/dataset_experiment.ipynb'), as_version=4)
          assert sum(cell.cell_type == 'code' for cell in notebook.cells) == 3
          assert sum(cell.cell_type == 'markdown' for cell in notebook.cells) == 4
          assert 'Eduardo J. Barrios' in notebook.cells[0].source
          PY
      - name: Sectioned Hy notebook execution
        run: |
          python - <<'PY'
          import nbformat
          import subprocess
          import tempfile
          from pathlib import Path
          source = '; %% [markdown]\n; ## Check shared state\n; %% [code]\n(setv x 7)\n; %% [code]\n(print (+ x 3))\n'
          with tempfile.TemporaryDirectory() as directory:
              file = Path(directory) / 'sections.hy'
              file.write_text(source)
              result = subprocess.run(['lispyn', 'execute', str(file), '--timeout', '30'], capture_output=True, text=True)
              assert result.returncode == 0, result.stderr
              nb = nbformat.read(file.with_suffix('.ipynb'), as_version=4)
              assert any('10' in str(o.get('text', '')) for o in nb.cells[-1].outputs)
          PY
      - name: Compile multimodal and fine-tuning Hy example
        run: lispyn build examples/vision_finetune.hy
      - name: Compile concise experiment
        run: lispyn build examples/compact_training.hy
      - name: Compile one-call workflows
        run: |
          lispyn build examples/one_call_training.hy
          lispyn build examples/one_call_lora.hy
          lispyn build examples/reproducible_run.hy
          lispyn build examples/plot_experiment.hy
          lispyn build examples/curve_designs.hy
      - name: Compile stratified split and with-eval macro
        run: lispyn build examples/stratified_inference.hy
      - name: Train with accuracy and best checkpoint (Python 3.11)
        if: matrix.python-version == '3.11'
        run: |
          python -m pip install 'torch==2.10.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[plots]'
          pytest -q tests/test_tracking.py tests/test_workflow.py tests/test_reproducibility.py tests/test_split_dataset.py tests/test_macros.py tests/test_scaffold.py tests/test_plots.py tests/test_curve_designs.py
          lispyn execute examples/compact_training.hy --timeout 120
          lispyn execute examples/reproducible_run.hy --timeout 120
          lispyn execute examples/stratified_inference.hy --timeout 120
          lispyn execute examples/generated_starter.hy --timeout 120
          lispyn execute examples/plot_experiment.hy --timeout 120
          lispyn execute examples/curve_designs.hy --timeout 120
          lispyn report examples/runs/curve-designs --plot examples/runs/curve-designs/report.png --theme dark --title 'Training curves' --train-color '#22D3EE' --val-color '#FBBF24'
          lispyn report examples/runs/plot-demo --plot examples/runs/plot-demo/cli-loss.png
          test -s examples/runs/plot-demo/loss.png
          test -s examples/runs/plot-demo/accuracy.png
          test -s examples/runs/plot-demo/cli-loss.png
          test -s examples/runs/curve-designs/loss.png
          test -s examples/runs/curve-designs/accuracy.svg
          test -s examples/runs/curve-designs/dark.png
          test -s examples/runs/curve-designs/report.png
          lispyn report examples/runs/smoke
          lispyn execute examples/one_call_training.hy --timeout 120
          python - <<'PY'
          import json
          import nbformat
          from pathlib import Path
          path = Path('examples/artifacts')
          assert (path / 'best.pt').is_file()
          history = json.loads((path / 'history.json').read_text())
          assert len(history['val_accuracy']) == 3
          notebook = nbformat.read('examples/compact_training.ipynb', as_version=4)
          assert any('restored best checkpoint' in str(output.get('text', ''))
                     for output in notebook.cells[-1].outputs)
          PY
      - name: Real PyTorch dataset experiment (Python 3.11)
        if: matrix.python-version == '3.11'
        run: |
          python -m pip install 'torch==2.10.0+cpu' 'torchvision==0.25.0+cpu' 'torchaudio==2.10.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          pytest -q tests/test_media_training.py
          lispyn execute examples/dataset_experiment.hy --timeout 120
          lispyn execute examples/vision_finetune.hy --timeout 120
          python - <<'PY'
          import nbformat
          nb = nbformat.read('examples/dataset_experiment.ipynb', as_version=4)
          assert any('validation loss:' in str(o.get('text', '')) for o in nb.cells[-1].outputs)
          PY
      - name: Compile LoRA, vision and audio Hy examples
        run: |
          lispyn build examples/text_lora.hy
          lispyn build examples/vision_transfer.hy
          lispyn build examples/audio_features.hy
      - name: Real LoRA and TorchAudio integration (Python 3.11)
        if: matrix.python-version == '3.11'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install -e '.[peft]'
          python -m pip install 'torchcodec==0.10.0' --index-url https://download.pytorch.org/whl/cpu
          pytest -q tests/test_peft_audio.py tests/test_workflow.py
          lispyn execute examples/text_lora.hy --timeout 120
          lispyn execute examples/one_call_lora.hy --timeout 120
          lispyn execute examples/audio_features.hy --timeout 120
