name: Tests
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev,data]'
      - run: pytest -q
      - name: Hy translation smoke test
        run: |
          python - <<'PY'
          import subprocess
          import tempfile
          from pathlib import Path
          with tempfile.TemporaryDirectory() as temp:
              path = Path(temp) / 'sample.hy'
              path.write_text('(print (+ 1 2))\n')
              p = subprocess.run(['lispyn', 'build', str(path)], capture_output=True, text=True)
              assert p.returncode == 0, p.stderr
              assert path.with_suffix('.ipynb').exists()
          PY
      - name: End-to-end Hy -> executed notebook
        run: |
          python - <<'PY'
          import nbformat
          import subprocess
          import tempfile
          from pathlib import Path
          with tempfile.TemporaryDirectory() as temp:
              path = Path(temp) / 'experiment.hy'
              path.write_text('(print (+ 1 2))\n')
              p = subprocess.run(['lispyn', 'execute', str(path), '--timeout', '30'], capture_output=True, text=True)
              assert p.returncode == 0, p.stderr
              notebook = nbformat.read(path.with_suffix('.ipynb'), as_version=4)
              assert any('3' in str(output.get('text', '')) for output in notebook.cells[1].outputs)
              p = subprocess.run(['lispyn', 'run', str(path)], capture_output=True, text=True)
              assert p.returncode == 0, p.stderr
              assert p.stdout.strip() == '3'
          PY
      - name: Lispyn macro compilation smoke test
        run: lispyn build examples/first_experiment.hy
      - name: Sectioned notebook compilation
        run: |
          lispyn build examples/dataset_experiment.hy
          python - <<'PY'
          import nbformat
          from pathlib import Path
          notebook = nbformat.read(Path('examples/dataset_experiment.ipynb'), as_version=4)
          assert sum(cell.cell_type == 'code' for cell in notebook.cells) == 3
          assert sum(cell.cell_type == 'markdown' for cell in notebook.cells) == 4
          assert 'Eduardo J. Barrios' in notebook.cells[0].source
          PY
      - name: Sectioned Hy notebook execution
        run: |
          python - <<'PY'
          import nbformat
          import subprocess
          import tempfile
          from pathlib import Path
          source = '; %% [markdown]\n; ## Check shared state\n; %% [code]\n(setv x 7)\n; %% [code]\n(print (+ x 3))\n'
          with tempfile.TemporaryDirectory() as directory:
              file = Path(directory) / 'sections.hy'
              file.write_text(source)
              result = subprocess.run(['lispyn', 'execute', str(file), '--timeout', '30'], capture_output=True, text=True)
              assert result.returncode == 0, result.stderr
              nb = nbformat.read(file.with_suffix('.ipynb'), as_version=4)
              assert any('10' in str(o.get('text', '')) for o in nb.cells[-1].outputs)
          PY
      - name: Compile multimodal and fine-tuning Hy example
        run: lispyn build examples/vision_finetune.hy
      - name: Real PyTorch dataset experiment (Python 3.11)
        if: matrix.python-version == '3.11'
        run: |
          python -m pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pytest -q tests/test_media_training.py
          lispyn execute examples/dataset_experiment.hy --timeout 120
          lispyn execute examples/vision_finetune.hy --timeout 120
          python - <<'PY'
          import nbformat
          nb = nbformat.read('examples/dataset_experiment.ipynb', as_version=4)
          assert any('validation loss:' in str(o.get('text', '')) for o in nb.cells[-1].outputs)
          PY
      - name: Compile LoRA, vision and audio Hy examples
        run: |
          lispyn build examples/text_lora.hy
          lispyn build examples/vision_transfer.hy
          lispyn build examples/audio_features.hy
      - name: Real LoRA and TorchAudio integration (Python 3.11)
        if: matrix.python-version == '3.11'
        run: |
          python -m pip install -e '.[peft]' torchcodec
          pytest -q tests/test_peft_audio.py
          lispyn execute examples/text_lora.hy --timeout 120
          lispyn execute examples/audio_features.hy --timeout 120
