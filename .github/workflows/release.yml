name: Publish Lispyn to PyPI

# The exact workflow filename and environment match the pending PyPI
# Trusted Publisher: edujbarrios/lispyn, release.yml, environment pypi.
on:
  push:
    tags:
      - 'v*'
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Validate and build release
    if: >-
      (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')) ||
      (github.ref == 'refs/heads/main' &&
       startsWith(github.event.head_commit.message, 'release: publish v') &&
       endsWith(github.event.head_commit.message, ' [pypi]'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify release version and package identity
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            # Explicit maintainer-approved release commit on main.
            version="$(python - <<'PY'
          import json, os, re
          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as f:
              message = json.load(f)["head_commit"]["message"].splitlines()[0]
          match = re.fullmatch(
              r"release: publish v([0-9]+\.[0-9]+\.[0-9]+(?:a[0-9]+|b[0-9]+|rc[0-9]+)?) \[pypi\]",
              message,
          )
          if not match:
              raise SystemExit("Invalid release commit message")
          print(match.group(1))
          PY
            )"
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          python - "$version" <<'PY'
          import pathlib, sys, tomllib
          project = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']
          version = sys.argv[1]
          assert project['name'] == 'lispyn', 'Wrong distribution name'
          assert project['version'] == version, (project['version'], version)
          print(f"Verified release: lispyn {version}")
          PY
      - name: Install test and release tools
        run: |
          python -m pip install --upgrade build twine
          python -m pip install -e '.[dev,data,plots]'
      - name: Run core tests and compile the example notebooks
        run: |
          python -m pytest -q
          lispyn gallery
      - name: Build distributions and check metadata
        run: |
          python -m build
          python -m twine check --strict dist/*
      - name: Verify source package, wheel and version
        run: |
          python - <<'PY'
          import os, pathlib, tarfile, zipfile
          wheel, = pathlib.Path('dist').glob('*.whl')
          sdist, = pathlib.Path('dist').glob('*.tar.gz')
          with zipfile.ZipFile(wheel) as z:
              names = z.namelist()
              metadata_name = next(n for n in names if n.endswith('.dist-info/METADATA'))
              metadata = z.read(metadata_name).decode()
              assert 'Name: lispyn' in metadata
              assert 'Version: ' + os.environ['RELEASE_VERSION'] in metadata
              for suffix in ('/macros.hy', '/LICENSE', '/NOTICE', '/entry_points.txt'):
                  assert any(n.endswith(suffix) for n in names), suffix
          with tarfile.open(sdist) as t:
              names = t.getnames()
              for suffix in ('/src/lispyn/macros.hy', '/LICENSE', '/NOTICE', '/README.md'):
                  assert any(n.endswith(suffix) for n in names), suffix
          print('Verified wheel, source distribution, authorship and Hy macros')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lispyn-release-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish to PyPI (Trusted Publishing)
    concurrency:
      group: lispyn-pypi-publish
      cancel-in-progress: false
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/lispyn/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lispyn-release-distributions
          path: dist/
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  tag-published-release:
    name: Tag the successfully published version
    if: github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Create version tag after successful publishing
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          version="$(python - <<'PY'
          import pathlib, tomllib
          print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])
          PY
          )"
          git tag -a "v$version" -m "Lispyn $version"
          git push origin "v$version"
