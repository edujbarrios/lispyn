name: Package verification (no PyPI upload)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distribution:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Validate licenses, Hy macro sources, and release metadata
        run: |
          python - <<'PY'
          from glob import glob
          from zipfile import ZipFile
          from tarfile import open as taropen
          wheel, = glob('dist/*.whl')
          sdist, = glob('dist/*.tar.gz')
          with ZipFile(wheel) as z:
              names = z.namelist()
              metadata_name = next(n for n in names if n.endswith('.dist-info/METADATA'))
              metadata = z.read(metadata_name).decode()
              assert any(n.endswith('/macros.hy') for n in names)
              assert any(n.endswith('/LICENSE') for n in names)
              assert any(n.endswith('/NOTICE') for n in names)
              assert any(n.endswith('/entry_points.txt') for n in names)
              assert 'Name: lispyn' in metadata
              assert 'Version: 0.14.0a1' in metadata
              assert 'License-Expression: Apache-2.0' in metadata
          with taropen(sdist) as archive:
              names = archive.getnames()
              assert any(n.endswith('/src/lispyn/macros.hy') for n in names)
              assert any(n.endswith('/LICENSE') for n in names)
              assert any(n.endswith('/NOTICE') for n in names)
              assert any(n.endswith('/README.md') for n in names)
          print('Release content verified in wheel and source distribution')
          PY
      - name: Install wheel in an isolated environment and compile a Hy macro
        run: |
          python -m venv /tmp/lispyn-wheel-env
          /tmp/lispyn-wheel-env/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/lispyn-wheel-env/bin/lispyn --version
          /tmp/lispyn-wheel-env/bin/lispyn doctor --json > wheel-doctor.json
          cat > installed.hy <<'HY'
          (require lispyn.macros [md pip-install])
          (md "# Installed wheel" "This Markdown is compiled, not executed.")
          (pip-install "math")
          (print (+ 2 3))
          HY
          /tmp/lispyn-wheel-env/bin/lispyn build installed.hy
          /tmp/lispyn-wheel-env/bin/python - <<'PY'
          import json, nbformat
          from pathlib import Path
          report = json.loads(Path('/tmp/wheel-doctor.json').read_text())
          assert report['can_build']
          assert report['lispyn'] == '0.14.0a1'
          nb = nbformat.read('/tmp/installed.ipynb', as_version=4)
          assert any('lispyn-pip-install' in c.metadata.get('tags', [])
                     for c in nb.cells if c.cell_type == 'code')
          assert any(c.cell_type == 'markdown' and 'Installed wheel' in c.source
                     for c in nb.cells)
          PY
      - name: Install source distribution in a separate clean environment
        run: |
          python -m venv /tmp/lispyn-sdist-env
          /tmp/lispyn-sdist-env/bin/python -m pip install dist/*.tar.gz
          (cd /tmp && /tmp/lispyn-sdist-env/bin/lispyn --version && /tmp/lispyn-sdist-env/bin/lispyn doctor)
      - uses: actions/upload-artifact@v4
        with:
          name: lispyn-verified-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 30
